# Comment the Read the Docs pull request preview URL on each new pull request.
#
# Read the Docs builds a preview of every pull request (enabled in the RTD
# project settings under "Pull request builds"). The build result appears as
# the "docs/readthedocs.org:zarr-specs" status check, but the preview URL is
# only reachable through that check's "Details" link. This workflow posts the
# URL as a comment so it is visible at a glance.
#
# The preview URL pattern is documented at
# https://docs.readthedocs.com/platform/stable/pull-requests.html

name: Read the Docs preview link

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      # Deliberately no checkout: pull_request_target runs with write
      # permissions, so this job must not execute code from the PR branch.
      - uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- rtd-preview-link -->';
            const pr = context.payload.pull_request.number;
            const slug = 'zarr-specs';
            const root = `https://${slug}--${pr}.org.readthedocs.build/en/${pr}/`;
            const body = [
              marker,
              `Read the Docs preview for this pull request: ${root}`,
              '',
              'The preview is rebuilt on every push; wait for the '
              + '`docs/readthedocs.org:zarr-specs` check to pass before opening it.',
            ].join('\n');
            const { owner, repo } = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pr, per_page: 100,
            });
            if (comments.some(c => c.body && c.body.includes(marker))) {
              core.info('Preview link comment already present; nothing to do.');
              return;
            }
            await github.rest.issues.createComment({ owner, repo, issue_number: pr, body });
